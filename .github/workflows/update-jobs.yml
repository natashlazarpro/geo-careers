name: Update GIS employers

on:
  schedule:
    - cron: "17 5 * * *"        # daily ~06:17 Berlin time: Arbeitsagentur jobs + geocoding
  push:
    paths: ["research/inbox/**"]    # research results from the scheduled Claude task
  workflow_dispatch:
    inputs:
      linkedin:
        description: "Also fetch LinkedIn jobs via SocialCrawl (uses up to 100 credits)"
        type: boolean
        default: false
      enrich_credits:
        description: "Max SocialCrawl credits for filling empty columns from LinkedIn (5 per company)"
        default: "100"
      sector_updates:
        description: "Branch per employer as JSON {\"berlin:1\": \"6+11\"} (numbers from scraper/branchen.py); usually empty"
        default: ""
      new_employers:
        description: "New employers found by research, as a JSON list (see RESEARCH.md fields); usually empty"
        default: ""
      enrich_cities:
        description: "Only fill these city sheets (comma-separated, e.g. cologne,frankfurt,stuttgart); empty = all"
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  # Data lives in Cloudflare KV (namespace "geocareers-data"), not in this repo.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: c0692e0b23a25270623944360c717438

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Load data from Cloudflare
        run: python -m scraper.store pull

      - name: Set employer branches
        if: inputs.sector_updates != ''
        env:
          SECTOR_UPDATES: ${{ inputs.sector_updates }}
        run: python -m scraper.branchen apply

      - name: Add new employers
        if: inputs.new_employers != ''
        env:
          NEW_EMPLOYERS: ${{ inputs.new_employers }}
        run: python -m scraper.research new

      - name: Add research results handed off by the Claude task
        run: python -m scraper.research ingest

      - name: Fill empty columns from LinkedIn company pages (SocialCrawl, 5 credits per company)
        if: github.event_name != 'push'
        env:
          SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
          SOCIALCRAWL_ENRICH_MAX_CREDITS: ${{ inputs.enrich_credits || '100' }}
          ENRICH_CITIES: ${{ inputs.enrich_cities || '' }}
        run: python -m scraper.enrich

      - name: Find jobs, update workbook, geocode
        env:
          SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
          SOCIALCRAWL_MAX_CREDITS: "100"
        run: python -m scraper.build --no-agent ${{ github.event_name == 'push' && '--skip-fetch' || '' }} ${{ inputs.linkedin && '--linkedin' || '' }}

      - name: List employers waiting for research
        run: |
          mkdir -p research
          python -m scraper.research list 50 > research/pending.json
          python -m scraper.research targets > research/targets.json
          python -m scraper.research names > research/employers.json

      - name: Save data to Cloudflare
        run: python -m scraper.store push

      - name: Commit results
        run: |
          git config user.name "geocareers-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # start from the latest main so a run that started earlier can't conflict
          INGESTED=$(git ls-files --deleted research/inbox)        # inbox files added to the workbook this run
          cp research/pending.json research/targets.json research/employers.json /tmp/
          git fetch -q origin main && git reset -q --hard origin/main
          mkdir -p research && cp /tmp/pending.json /tmp/targets.json /tmp/employers.json research/
          git add research/pending.json research/targets.json research/employers.json
          [ -z "$INGESTED" ] || git rm -q --ignore-unmatch $INGESTED
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            git add -f data/                              # no Cloudflare yet: keep data in the repo
          fi
          git diff --staged --quiet || git commit -m "Update GIS employers $(date -u +%F)"
          git push origin HEAD:main
