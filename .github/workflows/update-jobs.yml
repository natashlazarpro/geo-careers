name: Update GIS employers

on:
  schedule:
    - cron: "17 5 * * *"        # daily ~06:17 Berlin time: Arbeitsagentur jobs + geocoding
  workflow_dispatch:
    inputs:
      linkedin:
        description: "Also fetch LinkedIn jobs via SocialCrawl (uses up to 100 credits)"
        type: boolean
        default: false
      enrich_credits:
        description: "Max SocialCrawl credits for filling empty columns from LinkedIn (5 per company)"
        default: "100"
      enrich_cities:
        description: "Only fill these city sheets (comma-separated, e.g. cologne,frankfurt,stuttgart); empty = all"
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fill empty columns from LinkedIn company pages (SocialCrawl, 5 credits per company)
        env:
          SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
          SOCIALCRAWL_ENRICH_MAX_CREDITS: ${{ inputs.enrich_credits || '100' }}
          ENRICH_CITIES: ${{ inputs.enrich_cities || '' }}
        run: python -m scraper.enrich

      - name: Find jobs, update workbook, geocode
        env:
          SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
          SOCIALCRAWL_MAX_CREDITS: "100"
        run: python -m scraper.build --no-agent ${{ inputs.linkedin && '--linkedin' || '' }}

      - name: Commit results
        run: |
          git config user.name "geocareers-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update GIS employers $(date -u +%F)"
          git push
