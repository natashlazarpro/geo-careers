name: Update GIS employers

on:
  schedule:
    - cron: "17 5 * * *"        # daily ~06:17 Berlin time: Arbeitsagentur jobs + research of new companies
  workflow_dispatch:
    inputs:
      linkedin:
        description: "Also fetch LinkedIn jobs via SocialCrawl (uses up to 100 credits)"
        type: boolean
        default: false
      max_companies:
        description: "Max. new companies the agent researches this run"
        default: "40"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
          SOCIALCRAWL_MAX_CREDITS: "100"
          AGENT_MAX_COMPANIES: ${{ inputs.max_companies || '40' }}
        run: python -m scraper.build ${{ inputs.linkedin && '--linkedin' || '' }}

      - name: Commit results
        run: |
          git config user.name "geocareers-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update GIS employers $(date -u +%F)"
          git push
