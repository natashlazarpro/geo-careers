<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoCareers — GIS Jobs Berlin</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xrgo4lxo6y");
  </script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f6f8;
      --surface:  #ffffff;
      --border:   #dde1e7;
      --muted:    #737a85;
      --text:     #1a1f2e;
      --subtext:  #3d4451;
      --p1: #cdb4db;
      --p2: #ffc8dd;
      --p3: #ffafcc;
      --p4: #bde0fe;
      --p5: #a2d2ff;
      --accent: #219ebc;
      --green:    #2da44e;
      --orange:   #d4912a;
      --alt-row:  #f5f6f8;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Topbar ─────────────────────────────────────────────────────────────── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
      white-space: nowrap;
    }

    .tagline {
      font-size: 12px;
      color: var(--muted);
      border-left: 1px solid var(--border);
      padding-left: 14px;
    }

    .spacer { flex: 1; }

    /* Language toggle */
    .lang-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .lang-btn {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .lang-btn.active {
      background: #d6eef7;
      color: #023047;
    }
    .lang-btn:not(.active):hover { background: var(--bg); color: var(--text); }


    /* ── Layout ─────────────────────────────────────────────────────────────── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ────────────────────────────────────────────────────────────── */
    #sidebar {
      width: 288px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .25s ease;
      min-height: 0;
    }

    #sidebar.detail-open {
      width: 380px;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-right: 1px solid rgba(255,255,255,0.6);
      box-shadow: 4px 0 32px rgba(0,0,0,0.08);
    }



    .filter-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .filter-group { margin-bottom: 12px; }

    .chip-wrap { display: flex; flex-wrap: wrap; gap: 4px; }

    .chip {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--subtext);
      cursor: pointer;
      transition: all .15s;
      user-select: none;
    }
    .chip:hover { border-color: var(--p5); color: #023047; }
    .chip.active { background: #d6eef7; border-color: var(--accent); color: #023047; }

    #reset-btn {
      width: 100%;
      padding: 6px;
      font-size: 11px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      margin-top: 2px;
    }
    #reset-btn:hover { border-color: var(--accent); color: #023047; }

    /* ── Company list ───────────────────────────────────────────────────────── */
    #company-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px;
    }
    #company-list::-webkit-scrollbar { width: 3px; }
    #company-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .c-card {
      padding: 10px 11px;
      border-radius: 7px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .13s;
      margin-bottom: 3px;
    }
    .c-card:hover { background: #e8f4fb; border-color: var(--accent); }
    .c-card.active { background: #d6eef7; border-color: var(--accent); }

    .c-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .c-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; }
    .c-badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 20px;
      margin-top: 4px;
      white-space: normal;
      word-break: break-word;
    }

    #no-results {
      display: none;
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ── Map ────────────────────────────────────────────────────────────────── */
    #map { flex: 1; }

    /* ── Popup ──────────────────────────────────────────────────────────────── */
    .mapboxgl-popup-content {
      background: #ffffff !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      padding: 0 !important;
      min-width: 290px;
      max-width: 330px;
      box-shadow: 0 8px 32px rgba(0,0,0,.12) !important;
    }
    .mapboxgl-popup-tip { display: none !important; }
    .mini-popup .mapboxgl-popup-content { min-width: unset; max-width: 200px; border-radius: 7px !important; }
    .mapboxgl-popup-close-button {
      color: var(--muted) !important;
      font-size: 18px !important;
      right: 8px !important; top: 8px !important;
      background: none !important;
    }
    .mapboxgl-popup-close-button:hover { color: var(--text) !important; }

    .pop-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
    }
    .pop-name {
      font-size: 15px; font-weight: 700;
      padding-right: 22px; margin-bottom: 3px;
    }
    .pop-sector { font-size: 11px; color: #219ebc; }

    .pop-body { padding: 10px 14px; }
    .pop-row {
      display: flex; gap: 8px;
      margin-bottom: 7px;
      font-size: 12px; align-items: flex-start;
    }
    .pop-lbl { color: var(--muted); min-width: 68px; flex-shrink: 0; }
    .pop-val { color: var(--subtext); line-height: 1.45; }
    .pop-about {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.6;
      padding: 8px 14px 10px;
      border-top: 1px solid var(--border);
    }

    .tech-wrap { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
    .tech-tag {
      font-size: 10px; padding: 2px 6px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 3px; color: var(--subtext);
    }

    .pop-actions {
      padding: 8px 14px 12px;
      display: flex; gap: 7px;
    }
    .pop-btn {
      flex: 1; padding: 7px 8px;
      border-radius: 6px; font-size: 11px; font-weight: 600;
      text-align: center; text-decoration: none;
      cursor: pointer; transition: all .13s; white-space: nowrap;
    }
    .pop-btn-kununu { flex:1; padding:7px 8px; border-radius:6px; font-size:11px;
      font-weight:600; text-align:center; text-decoration:none;
      background:var(--bg); border:1px solid var(--border); color:var(--subtext);
      cursor:pointer; transition: all .13s; }
    .pop-btn-kununu:hover { border-color:var(--accent); color:var(--accent); }
    .pop-btn-careers { width:100%; padding:10px 8px; border-radius:6px; font-size:13px;
      font-weight:700; text-align:center; text-decoration:none; display:block;
      background:#fb8500; color:#ffffff; border:none; cursor:pointer;
      transition: all .13s; }
    .pop-btn-careers:hover { background:#e07600; }
    .pop-primary   { background: #219ebc; border: 1px solid #1a8aaa; color: #ffffff; }
    .pop-primary:hover { background: #1a8aaa; }
    .pop-secondary { background: var(--bg); border: 1px solid var(--border); color: var(--subtext); }
    .pop-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .pop-disabled  { background: var(--bg); border: 1px solid var(--border); color: var(--muted); cursor: default; }

    /* ── Sector badge colors ─────────────────────────────────────────────────── */
    .s-mobility    { background:#8ecae6; color:#023047; }
    .s-env         { background:#ffb703; color:#3a2500; }
    .s-infra       { background:#023047; color:#ffffff; }
    .s-tech        { background:#219ebc; color:#ffffff; }
    .s-planning    { background:#fb8500; color:#ffffff; }
    .s-logistics   { background:#8ecae6; color:#023047; }
    .s-other       { background:#f1f5f9; color:#475569; }

    /* ── Tech filter toggle ─────────────────────────────────────────────────── */
    #tech-toggle-btn {
      width: 100%;
      padding: 6px;
      font-size: 11px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 6px;
      text-align: center;
    }
    #tech-toggle-btn:hover { border-color: var(--accent); color: #023047; }
    #tech-filter-group { display: none; }
    #tech-filter-group.open { display: block; }
    #tech-filter-group .chip-wrap {
      max-height: 120px;
      overflow-y: auto;
      padding-right: 2px;
    }
    #tech-filter-group .chip-wrap::-webkit-scrollbar { width: 3px; }
    #tech-filter-group .chip-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Detail panel ───────────────────────────────────────────────────────── */
    #detail-panel {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
    }
    #back-btn {
      flex-shrink: 0;
      padding: 10px 14px;
      font-size: 12px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      transition: color .15s;
    }
    #back-btn:hover { color: #023047; }
    #detail-content { padding: 16px 14px; flex: 1; }
    .detail-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .detail-sector { font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing:.06em; color: #219ebc; margin-bottom: 6px; }
    .detail-meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .detail-website { font-size: 11px; color: var(--accent); text-decoration: none;
      display: block; margin-bottom: 12px; word-break: break-all; }
    .detail-website:hover { text-decoration: underline; }
    .detail-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .detail-about { font-size: 12.5px; color: var(--subtext); line-height: 1.65; }
    .detail-actions { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
    .detail-actions-row { display: flex; gap: 7px; }
    .kununu-rating { display:inline-flex; align-items:center; gap:4px;
      font-size:11px; font-weight:600; color:#fb8500; margin-top:4px; }
    .c-rating { font-size:10px; color:#fb8500; font-weight:600; margin-left:4px; }

    /* ── Role badge ──────────────────────────────────────────────────────────── */
    .r-core  { background:#023047; color:#ffffff; border:1px solid #023047; }
    .r-team  { background:#219ebc; color:#ffffff; border:1px solid #219ebc; }
    .r-side  { background:#8ecae6; color:#023047; border:1px solid #8ecae6; }

    /* ── GitHub link ─────────────────────────────────────────────────────────── */
    .github-link {
      display: flex;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      transition: color .15s;
      flex-shrink: 0;
    }
    .github-link:hover { color: var(--text); }

    /* ── Mobile ──────────────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      #topbar {
        padding: 0 12px;
        height: 46px;
        gap: 8px;
      }
      .tagline { display: none; }

      #main {
        flex-direction: column;
      }

      #sidebar {
        width: 100% !important;
        height: 45vh;
        border-right: none;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        order: 2;
      }

      #sidebar.detail-open {
        width: 100% !important;
        height: 55vh;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      }

      #map {
        flex: none;
        height: 55vh;
        order: 1;
      }

      .mapboxgl-popup-content {
        min-width: 220px !important;
        max-width: 270px !important;
      }

      #filters {
        padding: 10px !important;
      }

      .detail-name { font-size: 15px; }
    }
  </style>
</head>
<body>

<div id="topbar">
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#219ebc" stroke-width="2.2">
      <circle cx="12" cy="10" r="3"/>

    </svg>
    GeoCareers
  </div>
  <div class="tagline" id="tagline-text">Mapping your next career move.</div>
  <div class="spacer"></div>

  <div class="lang-toggle">
    <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn active" id="btn-de" onclick="setLang('de')">DE</button>

</div>

<div id="main">
  <div id="sidebar">
    <div id="filters" style="padding:14px;border-bottom:1px solid var(--border);overflow-y:auto;flex:1;overflow-y:auto;">

      <div class="filter-group">
        <div class="filter-label" id="lbl-sector">Sector</div>
        <div class="chip-wrap" id="sector-chips"></div>
      </div>

      <div class="filter-group">
        <div class="filter-label" id="lbl-role">GIS Role</div>
        <div class="chip-wrap" id="role-chips">
          <div class="chip" data-filter="role" data-value="Core product">
            <span class="t-en">Core product</span><span class="t-de" style="display:none">Kernprodukt</span>
          </div>
          <div class="chip" data-filter="role" data-value="Dedicated team">
            <span class="t-en">Dedicated team</span><span class="t-de" style="display:none">GIS-Team</span>
          </div>
          <div class="chip" data-filter="role" data-value="Side tool">
            <span class="t-en">Side tool</span><span class="t-de" style="display:none">Nebentool</span>

        </div>
      </div>

      <div class="filter-group">
        <div class="filter-label" id="lbl-size">Company size</div>
        <div class="chip-wrap" id="size-chips">
          <div class="chip" data-filter="size" data-value="11-50">11–50</div>
          <div class="chip" data-filter="size" data-value="51-200">51–200</div>
          <div class="chip" data-filter="size" data-value="201-500">201–500</div>
          <div class="chip" data-filter="size" data-value="500+">500+</div>

      <div class="filter-group">
        <div class="filter-label" id="lbl-lang">Language</div>
        <div class="chip-wrap" id="lang-chips">
          <div class="chip" data-filter="lang" data-value="ENG">
            <span class="t-en">English</span><span class="t-de" style="display:none">Englisch</span>
          </div>
          <div class="chip" data-filter="lang" data-value="DE">
            <span class="t-en">German</span><span class="t-de" style="display:none">Deutsch</span>

        </div>

      <button id="tech-toggle-btn">⚙ <span class="t-en">Add Tech Filters</span><span class="t-de" style="display:none">Tech-Filter hinzufügen</span></button>
      <div id="tech-filter-group">
        <div class="filter-label" id="lbl-tech">Tech Stack</div>
        <div class="chip-wrap" id="tech-chips"></div>
      </div>

      <button id="reset-btn">
        <span class="t-en">✕ Reset All Filters</span>
        <span class="t-de" style="display:none">✕ Alle Filter zurücksetzen</span>
      </button>
    </div>

    <div id="detail-panel">
      <button id="back-btn">
        <span class="t-en">← Back to list</span>
        <span class="t-de" style="display:none">← Zurück zur Liste</span>
      </button>
      <div id="detail-content"></div>
    </div>

    <div id="company-list">
      <div id="no-results">
        <span class="t-en">No companies match your filters.</span>
        <span class="t-de" style="display:none">Keine Unternehmen entsprechen den Filtern.</span>
      </div>

  </div>

  <div id="map"></div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const MAPBOX_TOKEN = 'pk.eyJ1IjoibmF0YXNobGF6YXIiLCJhIjoiY21yMHF3b3I3MDU3eTJzcXl0N3R4YmtqMyJ9.EyjHkouaqtUTC-Nswy91GA';
const DATA_URL = 'https://data-schield.natashlazar-pro.workers.dev/companies';

// ─── UI language state ────────────────────────────────────────────────────────
let LANG = 'de';

function setLang(lang) {
  LANG = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-de').classList.toggle('active', lang === 'de');
  document.querySelectorAll('.t-en').forEach(el => el.style.display = lang === 'en' ? '' : 'none');
  document.querySelectorAll('.t-de').forEach(el => el.style.display = lang === 'de' ? '' : 'none');

  // Update topbar tagline
  document.getElementById('tagline-text').textContent = lang === 'en'
    ? 'Mapping your next career move.'
    : 'Kartiere deinen nächsten Karriereschritt.';

  // Rebuild list, sector chips & reopen popup if open
  if (COMPANIES.length) buildSectorChips();
  applyFilters();
  if (activeCompany) showDetail(activeCompany);
}

// ─── Company data (fetched from worker) ─────────────────────────────────────
let COMPANIES = [];

// ─── Filter state ─────────────────────────────────────────────────────────────
const activeFilters = { sector: null, role: null, size: null, lang: null, tech: null };
let activePopup = null;
let activeCardId = null;
const markers = {};

// ─── Helpers ──────────────────────────────────────────────────────────────────
function sectorClass(sector) {
  if (!sector) return 's-other';
  const s = sector.toLowerCase();
  if (s.includes('mobil') || s.includes('mapping')) return 's-mobility';
  if (s.includes('environ'))  return 's-env';
  if (s.includes('infra'))    return 's-infra';
  if (s.includes('tech') || s.includes('gis')) return 's-tech';
  if (s.includes('urban') || s.includes('plan')) return 's-planning';
  if (s.includes('logis'))    return 's-logistics';
  return 's-other';
}
function roleClass(r) {
  return r === 'Core product' ? 'r-core' : r === 'Dedicated team' ? 'r-team' : 'r-side';
}
function markerColor(sector) {
  const cls = sectorClass(sector || '');
  const palette = {
    's-mobility': '#8ecae6', 's-env': '#ffb703', 's-infra': '#023047',
    's-tech': '#219ebc',     's-planning': '#fb8500', 's-logistics': '#8ecae6',
    's-other': '#94a3b8',
  };
  return palette[cls] || '#94a3b8';
}

// Sector translation map for German UI
const SECTOR_DE = {
  'Mobility':'Mobilität','Mapping':'Kartographie','Tech':'Technologie',
  'GIS':'GIS','Infrastructure':'Infrastruktur','Environment':'Umwelt',
  'Urban Planning':'Stadtplanung','Logistics':'Logistik','Energy':'Energie',
  'Earth Observation':'Erdbeobachtung','Consulting':'Beratung',
  'Real Estate':'Immobilien','Defense':'Verteidigung',
};
function sectorText(sector) {
  if (!sector) return '';
  if (LANG !== 'de') return sector;
  return sector.split('/').map(p => {
    const k = p.trim();
    return SECTOR_DE[k] || k;
  }).join(' / ');
}
function langFlag(l) {
  return l === 'ENG' ? 'EN' : l === 'DE' ? 'DE' : 'EN/DE';
}
function matchesFilters(c) {
  if (activeFilters.sector && !c.sector?.includes(activeFilters.sector)) return false;
  if (activeFilters.role   && c.role !== activeFilters.role)             return false;
  if (activeFilters.size   && c.size !== activeFilters.size)             return false;
  if (activeFilters.lang   && c.lang !== activeFilters.lang)             return false;
  if (activeFilters.tech   && !c.tech?.includes(activeFilters.tech))           return false;
  return true;
}

// ─── Sector chips (built after data loads) ────────────────────────────────────
function buildSectorChips() {
  const sectors = [...new Set(
    COMPANIES.flatMap(c => (c.sector||'').split('/').map(s => s.trim()))
  )].filter(Boolean).sort();
  const sChipWrap = document.getElementById('sector-chips');
  sChipWrap.innerHTML = '';
  sectors.forEach(s => {
    const el = document.createElement('div');
    el.className = 'chip';
    el.dataset.filter = 'sector';
    el.dataset.value = s;
    el.textContent = LANG === 'de' ? (SECTOR_DE[s] || s) : s;
    el.addEventListener('click', () => {
      const wasActive = el.classList.contains('active');
      document.querySelectorAll('.chip[data-filter="sector"]').forEach(c => c.classList.remove('active'));
      if (!wasActive) { el.classList.add('active'); activeFilters.sector = s; }
      else            { activeFilters.sector = null; }
      applyFilters();
    });
    sChipWrap.appendChild(el);
  });
}

// ─── Tech chips (built after data loads) ─────────────────────────────────────
function buildTechChips() {
  const techs = [...new Set(COMPANIES.flatMap(c => Array.isArray(c.tech) ? c.tech : (c.tech||'').split(',').map(t=>t.trim()).filter(Boolean)))].sort();
  const wrap = document.getElementById('tech-chips');
  wrap.innerHTML = '';
  techs.forEach(t => {
    const el = document.createElement('div');
    el.className = 'chip';
    el.dataset.filter = 'tech';
    el.dataset.value = t;
    el.textContent = t;
    el.addEventListener('click', () => {
      const wasActive = el.classList.contains('active');
      document.querySelectorAll('.chip[data-filter="tech"]').forEach(c => c.classList.remove('active'));
      if (!wasActive) { el.classList.add('active'); activeFilters.tech = t; }
      else            { activeFilters.tech = null; }
      applyFilters();
    });
    wrap.appendChild(el);
  });
  // toggle button
  document.getElementById('tech-toggle-btn').addEventListener('click', () => {
    document.getElementById('tech-filter-group').classList.toggle('open');
  });
}

// ─── Map ──────────────────────────────────────────────────────────────────────
mapboxgl.accessToken = MAPBOX_TOKEN;

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: [13.405, 52.515],
  zoom: 11.5
});

map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');

// ─── Popup builder ────────────────────────────────────────────────────────────
function buildPopupHTML(c) {
  const about = LANG === 'de' ? c.about_de : c.about_en;
  const roleLabel = LANG === 'de'
    ? (c.role === 'Core product' ? 'Kernprodukt' : c.role === 'Dedicated team' ? 'GIS-Team' : 'Nebentool')
    : c.role;
  const sizeLabel = c.size;
  const careersLabel = LANG === 'de' ? 'Stellen ansehen' : 'View Jobs';
  const linkedinLabel = 'LinkedIn';
  const noJobs = LANG === 'de' ? 'Keine Stellenseite' : 'No jobs page';
  const addressLabel = LANG === 'de' ? 'Adresse' : 'Address';
  const roleLabel2 = LANG === 'de' ? 'GIS-Rolle' : 'GIS Role';
  const sizeLabel2 = LANG === 'de' ? 'Größe' : 'Size';
  const techLabel  = LANG === 'de' ? 'Tech-Stack' : 'Tech stack';
  const langLabel  = LANG === 'de' ? 'Sprache' : 'Language';
  const langVal = c.lang === 'ENG' ? (LANG === 'de' ? 'Englisch' : 'English')
                : c.lang === 'DE'  ? (LANG === 'de' ? 'Deutsch' : 'German')
                : (LANG === 'de' ? 'Englisch / Deutsch' : 'English / German');
  const techTags = c.tech.map(t => `<span class="tech-tag">${t}</span>`).join('');
  const careersBtn = c.careers
    ? `<a class="pop-btn pop-primary" href="${c.careers}" target="_blank">${careersLabel}</a>`
    : `<span class="pop-btn pop-disabled">${noJobs}</span>`;
  const linkedinBtn = c.linkedin
    ? `<a class="pop-btn pop-secondary" href="${c.linkedin}" target="_blank">${linkedinLabel}</a>`
    : '';

  return `
    <div class="pop-header">
      <div class="pop-name">${c.name}</div>
      <div class="pop-sector">${sectorText(c.sector)}</div>
    </div>
    <div class="pop-body">
      <div class="pop-row">
        <span class="pop-lbl">${addressLabel}</span>
        <span class="pop-val">${c.address}</span>
      </div>
      <div class="pop-row">
        <span class="pop-lbl">${roleLabel2}</span>
        <span class="pop-val">
          <span class="c-badge ${roleClass(c.role)}" style="font-size:10px;padding:2px 8px;">${roleLabel}</span>
        </span>
      </div>
      <div class="pop-row">
        <span class="pop-lbl">${sizeLabel2}</span>
        <span class="pop-val">${sizeLabel}</span>
      </div>
      <div class="pop-row">
        <span class="pop-lbl">${langLabel}</span>
        <span class="pop-val">${langVal}</span>
      </div>
      <div class="pop-row">
        <span class="pop-lbl">${techLabel}</span>
        <span class="pop-val"><div class="tech-wrap">${techTags}</div></span>
      </div>
    </div>
    ${about ? `<div class="pop-about">${about}</div>` : ''}
    <div class="pop-actions">
      ${careersBtn}
      ${linkedinBtn}
    </div>
  `;
}

// ─── Show detail in sidebar ───────────────────────────────────────────────────
let activeCompany = null;

function showDetail(c) {
  activeCompany = c;
  const about = LANG === 'de' ? (c.about_de || c.about_en) : c.about_en;
  const langText = c.lang === 'ENG' ? (LANG === 'de' ? 'Englisch' : 'English')
                 : c.lang === 'DE'  ? (LANG === 'de' ? 'Deutsch' : 'German')
                 : (LANG === 'de' ? 'Englisch / Deutsch' : 'English / German');
  const careersLabel = LANG === 'de' ? 'Stellen ansehen' : 'View Jobs';
  const reviewsLabel = LANG === 'de' ? 'Bewertungen lesen' : 'Read Reviews';
  const addrLabel = LANG === 'de' ? 'Adresse' : 'Address';
  const techTags = (Array.isArray(c.tech) ? c.tech : (c.tech||'').split(','))
    .map(t => t.trim()).filter(Boolean)
    .map(t => `<span class="tech-tag">${t}</span>`).join('');
  const sector = sectorText(c.sector);
  const kununuBtn = c.kununu
    ? `<a class="pop-btn-kununu" href="${c.kununu}" target="_blank">${reviewsLabel}</a>`
    : '';
  const careersBtn = c.careers
    ? `<a class="pop-btn-careers" href="${c.careers}" target="_blank">${careersLabel}</a>`
    : '';
  const linkedinBtn = c.linkedin
    ? `<a class="pop-btn pop-secondary" href="${c.linkedin}" target="_blank">LinkedIn</a>`
    : '';
  const secondRow = (kununuBtn || linkedinBtn)
    ? `<div class="detail-actions-row">${kununuBtn}${linkedinBtn}</div>` : '';
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-name">${c.name}</div>
    <div class="detail-sector">${sector}</div>
    <div class="detail-meta">${c.size} · ${langText}${c.kununu_rating ? ` · <span class="kununu-rating">★ ${c.kununu_rating}</span>` : ''}</div>
    ${c.address ? `<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">${c.address}</div>` : ''}
    ${c.website ? `<a class="detail-website" href="${c.website}" target="_blank">${c.website.replace(/^https?:\/\//,'')}</a>` : ''}
    <hr class="detail-divider">
    ${about ? `<div class="detail-about">${about}</div>` : ''}
    ${techTags ? `<div class="tech-wrap" style="margin-top:10px;">${techTags}</div>` : ''}
    <div class="detail-actions">${careersBtn}${secondRow}</div>
  `;
  document.getElementById('detail-panel').style.display = 'flex';
  document.getElementById('filters').style.display = 'none';
  document.getElementById('company-list').style.display = 'none';
  setActiveCard(c.id);
}

function hideDetail() {
  activeCompany = null;
  document.getElementById('sidebar').classList.remove('detail-open');
  document.getElementById('detail-panel').style.display = 'none';
  document.getElementById('filters').style.display = 'block';
  document.getElementById('company-list').style.display = 'flex';
  setActiveCard(null);
  if (activePopup) { activePopup.remove(); activePopup = null; }
}

function openPopup(c) {
  showDetail(c);
  // Minimal tooltip on map
  if (activePopup) activePopup.remove();
  activePopup = new mapboxgl.Popup({ closeButton: false, maxWidth: '200px', offset: 18, className: 'mini-popup' })
    .setLngLat([c.lng, c.lat])
    .setHTML(`<div style="padding:7px 11px;"><div style="font-weight:600;font-size:13px;">${c.name}</div><div style="font-size:11px;color:#219ebc;margin-top:2px;">${sectorText(c.sector)}</div></div>`)
    .addTo(map);
}

// ─── Markers ──────────────────────────────────────────────────────────────────
function createMarker(c) {
  const color = markerColor(c.sector);
  // Outer el: passed to Mapbox — never touch its transform (Mapbox uses it for positioning)
  const el = document.createElement('div');
  el.style.cssText = 'width:13px;height:13px;cursor:pointer;';
  // Inner dot: all visual styling and scale effects go here
  const dot = document.createElement('div');
  dot.style.cssText = `
    width:13px;height:13px;border-radius:50%;
    background:${color};border:2px solid rgba(255,255,255,.9);
    box-shadow:0 0 0 1.5px ${color}99,0 2px 6px rgba(0,0,0,.35);
    transition:transform .13s;will-change:transform;
  `;
  el.appendChild(dot);
  el.addEventListener('mouseenter', () => dot.style.transform = 'scale(1.7)');
  el.addEventListener('mouseleave', () => {
    dot.style.transform = activeCardId === c.id ? 'scale(1.5)' : 'scale(1)';
  });
  el.addEventListener('click', e => {
    e.stopPropagation();
    map.flyTo({ center: [c.lng, c.lat], zoom: Math.max(map.getZoom(), 13), duration: 400 });
    openPopup(c);
  });
  const marker = new mapboxgl.Marker({ element: el, anchor: 'center' })
    .setLngLat([c.lng, c.lat]).addTo(map);
  return { marker, dot };
}

// ─── Card list ────────────────────────────────────────────────────────────────
function setActiveCard(id) {
  activeCardId = id;
  document.querySelectorAll('.c-card').forEach(el => {
    el.classList.toggle('active', +el.dataset.id === id);
    if (+el.dataset.id === id) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  Object.entries(markers).forEach(([cid, { dot }]) => {
    dot.style.transform = +cid === id ? 'scale(1.5)' : 'scale(1)';
  });
}

function buildList(companies) {
  // Sort by kununu_rating descending (nulls at end)
  companies = [...companies].sort((a, b) => {
    if (a.kununu_rating && b.kununu_rating) return b.kununu_rating - a.kununu_rating;
    if (a.kununu_rating) return -1;
    if (b.kununu_rating) return 1;
    return 0;
  });
  const list = document.getElementById('company-list');
  list.querySelectorAll('.c-card').forEach(el => el.remove());
  document.getElementById('no-results').style.display = companies.length ? 'none' : 'block';

  companies.forEach(c => {
    const div = document.createElement('div');
    div.className = 'c-card';
    div.dataset.id = c.id;
    div.innerHTML = `
      <div class="c-name">${c.name}</div>
      <div class="c-meta"><span>${c.size}</span><span>${langFlag(c.lang)}</span>${c.kununu_rating ? `<span class="c-rating">★ ${c.kununu_rating}</span>` : ''}</div>
      <span class="c-badge ${sectorClass(c.sector)}" style="font-size:10px;padding:1px 7px;">${sectorText(c.sector)}</span>
    `;
    div.addEventListener('click', () => {
      map.flyTo({ center: [c.lng, c.lat], zoom: Math.max(map.getZoom(), 13), duration: 450 });
      openPopup(c);
    });
    list.insertBefore(div, document.getElementById('no-results'));
  });

  const vc = document.getElementById('visible-count'); if (vc) vc.textContent = companies.length;
}

// ─── Filters ──────────────────────────────────────────────────────────────────
function applyFilters() {
  const visible = COMPANIES.filter(matchesFilters);
  COMPANIES.forEach(c => {
    if (markers[c.id]) {
      markers[c.id].marker.getElement().style.display =
        visible.includes(c) ? 'block' : 'none';
    }
  });
  buildList(visible);
  if (activeCompany && !visible.find(c => c.id === activeCompany.id)) hideDetail();
}

document.getElementById('back-btn').addEventListener('click', hideDetail);

// Role / size / lang chips (sector chips get listeners in buildSectorChips)
document.querySelectorAll('.chip:not([data-filter="sector"])').forEach(chip => {
  chip.addEventListener('click', () => {
    const key = chip.dataset.filter;
    const val = chip.dataset.value;
    const wasActive = chip.classList.contains('active');
    document.querySelectorAll(`.chip[data-filter="${key}"]`).forEach(c => c.classList.remove('active'));
    if (!wasActive) { chip.classList.add('active'); activeFilters[key] = val; }
    else            { activeFilters[key] = null; }
    applyFilters();
  });
});

document.getElementById('reset-btn').addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  Object.keys(activeFilters).forEach(k => activeFilters[k] = null);
  applyFilters();
});

// ─── Set default language ─────────────────────────────────────────────────────
setLang('de');

// ─── Init ─────────────────────────────────────────────────────────────────────
map.on('load', async () => {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    COMPANIES = (await res.json()).map(c => ({
      ...c, lat: parseFloat(c.lat), lng: parseFloat(c.lng)
    }));
  } catch (err) {
    console.error('Failed to load company data:', err);
    return;
  }
  buildSectorChips();
  buildTechChips();
  COMPANIES.forEach(c => { markers[c.id] = createMarker(c); });
  buildList(COMPANIES);

});

// ─── Visitor counter ──────────────────────────────────────────────────────────

</script>
</body>
</html>
